name: Test

on:
  push:
    paths-ignore: ['**/*.md']
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  V_C_ERROR_BUG_REPORT_DISABLED: 1

jobs:
  linux:
    runs-on: ubuntu-24.04
    env:
      VMODULES: ${{ github.workspace }}/modules
      VULKAN_SDK: /usr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: modules/antono2/glfw
      - name: Bootstrap the V compatibility resolver
        uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        with:
          version: 0.5.2
      - name: Validate and resolve tested compatibility
        id: compat
        run: v run modules/antono2/glfw/tools/platform_ci.vsh compatibility-publication
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: antono2/vulkan
          ref: ${{ steps.compat.outputs.module_vulkan }}
          path: modules/antono2/vulkan
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        if: steps.compat.outputs.v_release != '0.5.2'
        with:
          version: ${{ steps.compat.outputs.v_release }}
      - name: Verify the declared dependency graph
        run: v run modules/antono2/glfw/scripts/check_installed_deps.vsh
      - name: Test setup dependency requests
        run: v run modules/antono2/glfw/scripts/test_setup.vsh
      - run: sudo apt-get update && sudo apt-get install -y libglfw3-dev libvulkan-dev libvulkan-volk-dev libwayland-dev libxkbcommon-dev wayland-protocols libosmesa6-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libx11-dev openbox xauth xvfb mesa-vulkan-drivers vulkan-validationlayers
      - run: v run modules/antono2/glfw/tools/build_native.vsh
      - name: Test generated bindings and the native Linux API
        run: v run modules/antono2/glfw/tools/platform_ci.vsh platform-checks
      - name: Test bounded Linux window startup with local Xlib
        run: v run modules/antono2/glfw/tools/platform_ci.vsh window-startup

  windows:
    runs-on: windows-2022
    env:
      VMODULES: ${{ github.workspace }}/modules
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: modules/antono2/glfw
      - name: Bootstrap the V compatibility resolver
        uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        with:
          version: 0.5.2
      - name: Validate and resolve tested compatibility
        id: compat
        run: v run modules/antono2/glfw/tools/platform_ci.vsh compatibility
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: antono2/vulkan
          ref: ${{ steps.compat.outputs.module_vulkan }}
          path: modules/antono2/vulkan
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        if: steps.compat.outputs.v_release != '0.5.2'
        with:
          version: ${{ steps.compat.outputs.v_release }}
      - name: Verify the declared dependency graph
        run: v run modules/antono2/glfw/scripts/check_installed_deps.vsh
      - name: Test setup dependency requests
        run: v run modules/antono2/glfw/scripts/test_setup.vsh
      - name: Install Vulkan SDK, SwiftShader, and binding headers
        uses: antono2/vulkan/.github/actions/setup-vulkan-ci@d471ec81d8f133a6ac1fddf511d4ce8d95866774
        with:
          sdk-version: ${{ steps.compat.outputs.ci_sdk }}
          artifact-tag: ${{ steps.compat.outputs.ci_runtime }}
          bindings-path: modules/antono2/vulkan
      - name: Build the pinned GLFW library
        run: v run modules/antono2/glfw/tools/build_native.vsh --work-dir "${{ runner.temp }}/GLFW with spaces"
      - name: Verify the public setup diagnostics
        working-directory: modules/antono2/glfw
        run: v run setup.vsh --check
      - name: Configure MSVC x64
        uses: antono2/vulkan/.github/actions/setup-msvc@23ec75dc6015776f3012880148ca90e66f63010a
      - name: Qualify the current V toolchain with MSVC and spaced native paths
        uses: antono2/vulkan/.github/actions/setup-v@1667d906b059ecc951f01c7cb20601d6b2b02b54
      - name: Test with the Microsoft C compiler
        working-directory: modules/antono2/glfw
        run: v run tools/platform_ci.vsh platform-checks

  macos:
    runs-on: macos-15
    env:
      VMODULES: ${{ github.workspace }}/modules
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: modules/antono2/glfw
      - name: Bootstrap the V compatibility resolver
        uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        with:
          version: 0.5.2
      - name: Validate and resolve tested compatibility
        id: compat
        run: v run modules/antono2/glfw/tools/platform_ci.vsh compatibility
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: antono2/vulkan
          ref: ${{ steps.compat.outputs.module_vulkan }}
          path: modules/antono2/vulkan
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        if: steps.compat.outputs.v_release != '0.5.2'
        with:
          version: ${{ steps.compat.outputs.v_release }}
      - name: Verify the declared dependency graph
        run: v run modules/antono2/glfw/scripts/check_installed_deps.vsh
      - name: Test setup dependency requests
        run: v run modules/antono2/glfw/scripts/test_setup.vsh
      - run: brew install vulkan-loader
      - run: v run modules/antono2/glfw/tools/build_native.vsh
      - name: Test generated bindings and the native macOS API
        run: v run modules/antono2/glfw/tools/platform_ci.vsh platform-checks

  linux-v-master:
    name: Advisory current V master and Vulkan master
    continue-on-error: true
    runs-on: ubuntu-24.04
    env:
      VMODULES: ${{ github.workspace }}/modules
      VULKAN_SDK: /usr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: modules/antono2/glfw
      - name: Bootstrap the V compatibility resolver
        uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        with:
          version: 0.5.2
      - name: Validate and resolve tested compatibility
        id: compat
        run: v run modules/antono2/glfw/tools/platform_ci.vsh compatibility
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: antono2/vulkan
          ref: master
          path: modules/antono2/vulkan
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: vlang/v
          ref: master
          path: toolchain/v
      - name: Build current V master
        run: v run modules/antono2/glfw/tools/platform_ci.vsh build-master
      - name: Test setup dependency requests
        run: v run modules/antono2/glfw/scripts/test_setup.vsh
      - run: sudo apt-get update && sudo apt-get install -y libglfw3-dev libvulkan-dev libvulkan-volk-dev libwayland-dev libxkbcommon-dev wayland-protocols libosmesa6-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libx11-dev openbox xauth xvfb mesa-vulkan-drivers vulkan-validationlayers
      - run: v run modules/antono2/glfw/tools/build_native.vsh
      - name: Test with V3 and GCC
        working-directory: modules/antono2/glfw
        run: v -cc gcc test .

  test:
    if: always()
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    steps:
      - name: Verify required platforms
        env:
          LINUX_RESULT: ${{ needs.linux.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
        run: |
          test "$LINUX_RESULT" = success
          test "$WINDOWS_RESULT" = success
          test "$MACOS_RESULT" = success
