name: Update GLFW

on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: glfw-upstream-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        with:
          version: 0.5.2
          install-dependencies: false
      - name: Fetch stable release and regenerate bindings
        env:
          GH_TOKEN: ${{ github.token }}
        run: v run tools/update_upstream.vsh
      - name: Verify proposal publication
        run: v run tools/publish_generated_branch.vsh --self-test
      - name: Open or refresh update PR
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: v run tools/publish_generated_branch.vsh --propose
